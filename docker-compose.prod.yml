# Production stack (on the VPS, in /opt/viet).
# IMAGE is written to .env by CI on every deploy.
services:
  app:
    image: ${IMAGE:?IMAGE is missing from .env}
    env_file: .env
    environment:
      DB_PATH: /data/viet.db
      PORT: 3001
    volumes:
      - viet-data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3001"   # only reachable through nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  viet-data:
