name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/viet

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copie du compose sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Déploiement
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ steps.img.outputs.name }}:${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE,GH_TOKEN,GH_ACTOR,DEPLOY_DIR
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            # mémorise l'image déployée (permet aussi un `docker compose up -d` manuel)
            sed -i '/^IMAGE=/d' .env
            echo "IMAGE=$IMAGE" >> .env
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            # vérifie que l'app répond
            PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2); PORT=${PORT:-3010}
            for i in $(seq 1 20); do
              curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null && echo "OK" && exit 0
              sleep 2
            done
            echo "L'app ne répond pas" >&2
            docker compose -f docker-compose.prod.yml logs --tail 50
            exit 1
