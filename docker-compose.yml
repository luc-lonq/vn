# Development stack: Vite dev server + API with hot reload. See docker-compose.prod.yml for production.
services:
  api:
    build: ./server
    env_file: .env
    environment:
      DB_PATH: /data/viet.db
      PORT: 3001
    volumes:
      - ./server/src:/app/src        # hot reload (node --watch)
      - db-data:/data                # persistent SQLite database
    ports:
      - "3001:3001"
    restart: unless-stopped

  web:
    build: ./web
    environment:
      API_URL: http://api:3001       # Vite proxies /api to the api service
      VITE_POLLING: ${VITE_POLLING:-false}
    volumes:
      - ./web:/app                   # Vite hot reload
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  web-node-modules:
